name: xenobill_flutter
description: "Xenobiz - Modern Fast Responsive POS & Billing Application"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  go_router: ^12.1.3
  intl: ^0.18.1
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  path: ^1.9.0
  dio: ^5.4.0
  json_annotation: ^4.8.1
  fl_chart: ^0.66.0
  qr_flutter: ^4.1.0
  printing: ^5.11.1
  pdf: ^3.10.7
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.8.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  mobile_scanner: ^7.4.0
  file_picker: ^12.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  drift_dev: ^2.14.0
  change_app_package_name: ^1.5.0


flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
